# Cloudflare Pages configuration for philipwantedagift.com
#
# With a wrangler.toml, this file is the source of truth for Pages bindings and
# variables (the dashboard shows them read-only). SECRETS are never stored here:
# set them with `npx wrangler pages secret put NAME` (see README > Deploying).
#
# Pages rule: an environment that overrides vars must also restate its bindings.

name = "philipwantedagift"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ---------- local development (`npm run dev`) ----------
[vars]
EMAIL_PROVIDER = "console"            # prints emails to the terminal; refuses to run off localhost
EMAIL_FROM_NAME = "PhilipWantedAGift.com"
APP_URL = "http://localhost:8788"

[[d1_databases]]
binding = "DB"
database_name = "philipwantedagift"
database_id = "00000000-0000-0000-0000-000000000000" # local only; real ids below
migrations_dir = "migrations"

# ---------- preview deployments (pull requests) ----------
[env.preview.vars]
EMAIL_PROVIDER = "brevo"
EMAIL_FROM_NAME = "PhilipWantedAGift.com (preview)"
APP_URL = "https://preview.philipwantedagift.pages.dev"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "philipwantedagift-preview"
database_id = "REPLACE_WITH_PREVIEW_DATABASE_ID"
migrations_dir = "migrations"

# ---------- production (main branch) ----------
[env.production.vars]
EMAIL_PROVIDER = "brevo"
EMAIL_FROM_NAME = "PhilipWantedAGift.com"
APP_URL = "https://philipwantedagift.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "philipwantedagift"
database_id = "REPLACE_WITH_PRODUCTION_DATABASE_ID"
migrations_dir = "migrations"
