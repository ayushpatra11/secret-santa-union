<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-labelledby="t">
  <title id="t">Philip, who wanted a gift</title>
  <!-- party hat -->
  <path d="M120 6 L92 70 L148 70 Z" fill="#f2c36b" stroke="#3a2405" stroke-width="4" stroke-linejoin="round"/>
  <path d="M103 46 L137 46 M98 58 L142 58" stroke="#e0445f" stroke-width="6" stroke-linecap="round"/>
  <circle cx="120" cy="8" r="9" fill="#e0445f" stroke="#3a2405" stroke-width="4"/>
  <!-- ears -->
  <ellipse cx="52" cy="122" rx="14" ry="20" fill="#f4c7a1" stroke="#3a2405" stroke-width="4"/>
  <ellipse cx="188" cy="122" rx="14" ry="20" fill="#f4c7a1" stroke="#3a2405" stroke-width="4"/>
  <!-- head -->
  <ellipse cx="120" cy="124" rx="68" ry="62" fill="#ffd9b8" stroke="#3a2405" stroke-width="4"/>
  <!-- hair tufts -->
  <path d="M76 82 q8 -16 22 -8 q6 -14 22 -6 q12 -12 24 0 q14 -6 20 10" fill="none" stroke="#3a2405" stroke-width="5" stroke-linecap="round"/>
  <!-- puppy-dog eyebrows -->
  <path d="M82 100 q14 -12 26 -2" fill="none" stroke="#3a2405" stroke-width="5" stroke-linecap="round"/>
  <path d="M158 100 q-14 -12 -26 -2" fill="none" stroke="#3a2405" stroke-width="5" stroke-linecap="round"/>
  <!-- big hopeful eyes -->
  <ellipse cx="96" cy="122" rx="15" ry="18" fill="#fff" stroke="#3a2405" stroke-width="4"/>
  <ellipse cx="144" cy="122" rx="15" ry="18" fill="#fff" stroke="#3a2405" stroke-width="4"/>
  <circle cx="99" cy="116" r="8" fill="#1b2a5a"/>
  <circle cx="147" cy="116" r="8" fill="#1b2a5a"/>
  <circle cx="102" cy="112" r="3" fill="#fff"/>
  <circle cx="150" cy="112" r="3" fill="#fff"/>
  <!-- blush -->
  <ellipse cx="78" cy="148" rx="11" ry="7" fill="#ff9aac" opacity=".7"/>
  <ellipse cx="162" cy="148" rx="11" ry="7" fill="#ff9aac" opacity=".7"/>
  <!-- wobbly hopeful mouth -->
  <path d="M104 156 q8 8 16 0 q8 -8 16 0" fill="none" stroke="#3a2405" stroke-width="5" stroke-linecap="round"/>
  <!-- jumper -->
  <path d="M60 252 q2 -56 60 -64 q58 8 60 64 Z" fill="#c8304a" stroke="#3a2405" stroke-width="4" stroke-linejoin="round"/>
  <path d="M78 222 l8 -8 8 8 8 -8 8 8 8 -8 8 8 8 -8 8 8 8 -8 8 8" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
  <!-- empty, expectant hands -->
  <ellipse cx="56" cy="214" rx="16" ry="12" fill="#ffd9b8" stroke="#3a2405" stroke-width="4" transform="rotate(-20 56 214)"/>
  <ellipse cx="184" cy="214" rx="16" ry="12" fill="#ffd9b8" stroke="#3a2405" stroke-width="4" transform="rotate(20 184 214)"/>
</svg>
