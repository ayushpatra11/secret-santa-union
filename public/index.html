<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PhilipWantedAGift.com</title>
    <meta
      name="description"
      content="Philip wanted a gift. Now everyone gets one. A private, ridiculous, delightful Secret Santa for friends."
    />
    <meta name="theme-color" content="#0b1530" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <canvas id="snow" aria-hidden="true"></canvas>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="#/home" aria-label="PhilipWantedAGift.com home">
        <img class="brand-mark" src="/philip.svg" alt="" width="40" height="40" />
        <span class="brand-name"
          >Philip<span class="b-want">Wanted</span>A<span class="b-gift">Gift</span><span class="b-tld">.com</span></span
        >
      </a>
      <nav id="nav" class="nav"></nav>
    </header>

    <main id="app" class="app" tabindex="-1">
      <div class="loading"><span class="spinner"></span></div>
    </main>

    <footer class="footer">
      <span id="quip">No Philips were harmed in the making of this website.</span><br />
      <span class="faint">A vibe-coded Secret Santa for friends · Your email is encrypted and never shown to anyone</span>
    </footer>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <noscript><p class="noscript">Secret Santa needs JavaScript to run.</p></noscript>
  </body>
</html>
